name: Build BUS FARE DESK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
                      self.external = any(k == "src" for k, _ in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      code = "".join(self.parts)
                      if code.strip():
                          self.scripts.append(code)
                      self.active = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/bus-fare-scripts").mkdir(exist_ok=True)
          for i, code in enumerate(parser.scripts):
              Path(f"/tmp/bus-fare-scripts/{i}.js").write_text(code, encoding="utf-8")
          print(f"Checking {len(parser.scripts)} inline JavaScript blocks")
          PY
          for file in /tmp/bus-fare-scripts/*.js; do node --check "$file"; done

      - name: Prepare Android project
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "bus-fare-desk",
            "version": "1.0.0",
            "private": true,
            "description": "BUS FARE DESK V60.15 Personal Edition"
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aljunatis.busfaredesk",
            "appName": "BUS FARE DESK",
            "webDir": "www"
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 leaflet@1.9.4
          mkdir -p www/leaflet
          cp -R node_modules/leaflet/dist/. www/leaflet/
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/assets/tagalog_tts
          curl -fL --retry 3 --retry-delay 2 -o android/app/src/main/assets/tagalog_tts/model.onnx "https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/main/tgl/model.onnx"
          curl -fL --retry 3 --retry-delay 2 -o android/app/src/main/assets/tagalog_tts/tokens.txt "https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/main/tgl/tokens.txt"
          test -s android/app/src/main/assets/tagalog_tts/model.onnx
          test -s android/app/src/main/assets/tagalog_tts/tokens.txt
          cat > android/app/src/main/assets/tagalog_tts/NOTICE.txt <<'EOF'
          BUS FARE DESK - BUNDLED TAGALOG TEXT-TO-SPEECH
          Model: Meta MMS-TTS Tagalog (tgl), converted to ONNX for sherpa-onnx
          Original model: https://huggingface.co/facebook/mms-tts-tgl
          ONNX conversion source: https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/tree/main/tgl
          Model license: Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0)
          Non-commercial personal use only. Attribution and license terms apply.
          sherpa-onnx runtime: https://github.com/k2-fsa/sherpa-onnx
          sherpa-onnx runtime license: Apache License 2.0
          EOF

          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          if root.exists():
              content = root.read_text(encoding="utf-8")
              if "https://jitpack.io" not in content:
                  content = content.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://jitpack.io' }")
              root.write_text(content, encoding="utf-8")
          app = Path("android/app/build.gradle")
          content = app.read_text(encoding="utf-8")
          if "com.github.k2-fsa:sherpa-onnx" not in content:
              content = content.replace("dependencies {", "dependencies {\n    implementation('com.github.k2-fsa:sherpa-onnx:v2.0.1') {\n        exclude group: 'com.github.k2-fsa.sherpa-onnx', module: 'sherpa-onnx-jvm'\n    }", 1)
          if "abiFilters 'arm64-v8a'" not in content:
              content = content.replace("defaultConfig {", "defaultConfig {\n        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }", 1)
          if "sherpa-onnx/native/**" not in content:
              content = content.replace("android {", "android {\n    packagingOptions { resources { excludes += ['sherpa-onnx/native/**'] } }", 1)
          app.write_text(content, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.RECORD_AUDIO"
          ]
          missing = [p for p in permissions if p not in content]
          if missing:
              tags = "".join(f'    <uses-permission android:name="{p}" />\n' for p in missing)
              content = content.replace("<application", tags + "    <application", 1)
          manifest.write_text(content, encoding="utf-8")
          PY

          mkdir -p android/app/src/main/java/com/aljunatis/busfaredesk
          cat > android/app/src/main/java/com/aljunatis/busfaredesk/MainActivity.java <<'JAVA'
          package com.aljunatis.busfaredesk;

          import android.Manifest;
          import android.content.Intent;
          import android.os.Build;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.RecognitionListener;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.content.Context;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.util.Locale;

          public class MainActivity extends BridgeActivity {
              private static final int LOCATION_PERMISSION_REQUEST = 7401;
              private static final int AUDIO_PERMISSION_REQUEST = 7402;
              private SpeechRecognizer speechRecognizer;
              private TextToSpeech textToSpeech;
              private BundledTagalogTts bundledTagalogTts;
              private boolean textToSpeechReady = false;
              private String pendingTagalogSpeech = "";
              private int speechLanguageAttempt = 0;
              private final String[] speechLanguages = {"fil-PH", "fil", "en-PH", ""};
              private LocationManager locationManager;
              private boolean locationStarted = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  locationManager = (LocationManager) getSystemService(LOCATION_SERVICE);
                  getBridge().getWebView().addJavascriptInterface(new LocationBridge(), "BusFareLocation");
                  getBridge().getWebView().addJavascriptInterface(new SpeechBridge(), "BusFareSpeech");
                  initializeTagalogTextToSpeech();
              }

              private final LocationListener locationListener = new LocationListener() {
                  @Override public void onLocationChanged(Location location) {
                      sendCoordinates(location.getLatitude(), location.getLongitude());
                  }
                  @Override public void onProviderEnabled(String provider) {}
                  @Override public void onProviderDisabled(String provider) {
                      sendStatus("Phone location provider disabled");
                  }
                  @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
              };

              private class LocationBridge {
                  @JavascriptInterface public void start() {
                      runOnUiThread(() -> startLocationUpdates());
                  }
                  @JavascriptInterface public void stop() {
                      runOnUiThread(() -> stopLocationUpdates());
                  }
              }

              private class SpeechBridge {
                  @JavascriptInterface public void start() { runOnUiThread(() -> startSpeechRecognition()); }
                  @JavascriptInterface public void stop() { runOnUiThread(() -> stopSpeechRecognition()); }
                  @JavascriptInterface public void speak(String message) {
                      if (message == null) return;
                      runOnUiThread(() -> speakTagalog(message));
                  }
                  @JavascriptInterface public void stopSpeaking() {
                      runOnUiThread(() -> { if (bundledTagalogTts != null) bundledTagalogTts.stop(); if (textToSpeech != null) textToSpeech.stop(); });
                  }
                  @JavascriptInterface public void setVoiceGender(String gender) {
                      runOnUiThread(() -> { if (bundledTagalogTts != null) bundledTagalogTts.setVoiceGender(gender); });
                  }
              }

              private void initializeTagalogTextToSpeech() {
                  sendTtsStatus("loading");
                  bundledTagalogTts = new BundledTagalogTts(this, status -> runOnUiThread(() -> {
                      if ("ready".equals(status)) {
                          textToSpeechReady = true;
                          sendTtsStatus("ready");
                          if (!pendingTagalogSpeech.isEmpty()) {
                              String queued = pendingTagalogSpeech;
                              pendingTagalogSpeech = "";
                              speakTagalogNow(queued);
                          }
                      } else if ("bundledUnavailable".equals(status)) {
                          sendTtsStatus("error");
                          initializeSystemTtsFallback();
                      } else {
                          sendTtsStatus(status);
                      }
                  }));
              }

              private void initializeSystemTtsFallback() {
                  try {
                      textToSpeech = new TextToSpeech(this, status -> runOnUiThread(() -> {
                          if (status != TextToSpeech.SUCCESS || textToSpeech == null) {
                              textToSpeechReady = false;
                              sendTtsStatus("languageUnavailable");
                              return;
                          }
                          try {
                              AudioAttributes attributes = new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ASSISTANCE_ACCESSIBILITY)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build();
                              textToSpeech.setAudioAttributes(attributes);
                              int languageResult = textToSpeech.setLanguage(new Locale("fil", "PH"));
                              if (languageResult < TextToSpeech.LANG_AVAILABLE) {
                                  languageResult = textToSpeech.setLanguage(new Locale("tl", "PH"));
                              }
                              if (languageResult < TextToSpeech.LANG_AVAILABLE) {
                                  textToSpeechReady = false;
                                  sendTtsStatus("languageUnavailable");
                                  return;
                              }
                              textToSpeechReady = true;
                              textToSpeech.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override public void onStart(String utteranceId) { sendTtsStatus("speaking"); }
                                  @Override public void onDone(String utteranceId) { sendTtsStatus("done"); }
                                  @Override public void onError(String utteranceId) { sendTtsStatus("error"); }
                              });
                              sendTtsStatus("systemFallback");
                              if (!pendingTagalogSpeech.isEmpty()) {
                                  String queued = pendingTagalogSpeech;
                                  pendingTagalogSpeech = "";
                                  speakTagalogNow(queued);
                              }
                          } catch (Exception error) {
                              textToSpeechReady = false;
                              sendTtsStatus("error");
                          }
                      }));
                  } catch (Exception error) {
                      sendTtsStatus("error");
                  }
              }

              private void speakTagalog(String message) {
                  if (message == null || message.trim().isEmpty()) return;
                  if (bundledTagalogTts != null && bundledTagalogTts.speak(message)) return;
                  if (textToSpeech == null || !textToSpeechReady) {
                      pendingTagalogSpeech = message;
                      sendTtsStatus("loading");
                      return;
                  }
                  speakTagalogNow(message);
              }

              private void speakTagalogNow(String message) {
                  if (bundledTagalogTts != null && bundledTagalogTts.speak(message)) return;
                  if (textToSpeech == null || !textToSpeechReady) {
                      pendingTagalogSpeech = message;
                      return;
                  }
                  try {
                      Bundle parameters = new Bundle();
                      parameters.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, 1.0f);
                      parameters.putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC);
                      textToSpeech.speak(message, TextToSpeech.QUEUE_FLUSH, parameters, "busfare-" + System.currentTimeMillis());
                  } catch (Exception error) {
                      sendTtsStatus("error");
                  }
              }

              private void sendTtsStatus(String status) {
                  String script = "window.onBusFareTtsStatus && window.onBusFareTtsStatus(" + JSONObject.quote(status) + ");";
                  runOnUiThread(() -> {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(script, null);
                      }
                  });
              }

              private void startSpeechRecognition() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_PERMISSION_REQUEST);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { sendSpeechError("not-available"); return; }
                  speechLanguageAttempt = 0;
                  startSpeechRecognitionAttempt();
              }

              private void startSpeechRecognitionAttempt() {
                  try {
                      destroySpeechRecognizer();
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      speechRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) { sendSpeechPartial(""); }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onError(int error) {
                              if (error == SpeechRecognizer.ERROR_NO_MATCH && speechLanguageAttempt < speechLanguages.length - 1) {
                                  speechLanguageAttempt++;
                                  sendSpeechRetry();
                                  startSpeechRecognitionAttempt();
                                  return;
                              }
                              sendSpeechError(String.valueOf(error));
                              destroySpeechRecognizer();
                          }
                          @Override public void onResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) sendSpeechResult(matches.get(0));
                              else sendSpeechError("no-match");
                              destroySpeechRecognizer();
                          }
                          @Override public void onPartialResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) sendSpeechPartial(matches.get(0));
                          }
                          @Override public void onEvent(int eventType, Bundle params) {}
                      });
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      String language = speechLanguages[speechLanguageAttempt];
                      if (!language.isEmpty()) {
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, language);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, language);
                      }
                      intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                      intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                      intent.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                      speechRecognizer.startListening(intent);
                  } catch (Exception error) { sendSpeechError("start-failed"); destroySpeechRecognizer(); }
              }

              private void sendSpeechRetry() {
                  String script = "window.onBusFareSpeechRetry && window.onBusFareSpeechRetry();";
                  runOnUiThread(() -> { if (getBridge() != null && getBridge().getWebView() != null) getBridge().getWebView().evaluateJavascript(script, null); });
              }

              private void stopSpeechRecognition() {
                  if (speechRecognizer != null) {
                      try { speechRecognizer.stopListening(); } catch (Exception ignored) {}
                      destroySpeechRecognizer();
                  }
              }

              private void destroySpeechRecognizer() {
                  if (speechRecognizer != null) {
                      try { speechRecognizer.cancel(); speechRecognizer.destroy(); } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }
              }

              private void sendSpeechPartial(String value) { sendSpeechCallback("onBusFareSpeechPartial", value); }
              private void sendSpeechResult(String value) { sendSpeechCallback("onBusFareSpeechResult", value); }
              private void sendSpeechError(String value) { sendSpeechCallback("onBusFareSpeechError", value); }
              private void sendSpeechCallback(String function, String value) {
                  String script = "window." + function + " && window." + function + "(" + JSONObject.quote(value == null ? "" : value) + ");";
                  runOnUiThread(() -> { if (getBridge() != null && getBridge().getWebView() != null) getBridge().getWebView().evaluateJavascript(script, null); });
              }

              private void startLocationUpdates() {
                  if (locationStarted) return;
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                      checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[] {
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      }, LOCATION_PERMISSION_REQUEST);
                      return;
                  }
                  try {
                      boolean gps = locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER);
                      boolean network = locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                      if (!gps && !network) {
                          sendStatus("Phone location is turned off");
                          return;
                      }
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED && gps) {
                          locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1500L, 3f, locationListener);
                      }
                      if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED && network) {
                          locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 4000L, 8f, locationListener);
                      }
                      locationStarted = true;
                      Location last = null;
                      if (gps && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                          last = locationManager.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      }
                      if (last == null && network && checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                          last = locationManager.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      }
                      if (last != null) sendCoordinates(last.getLatitude(), last.getLongitude());
                  } catch (SecurityException error) {
                      sendStatus("Location permission is required");
                  } catch (Exception error) {
                      sendStatus("Unable to start native GPS");
                  }
              }

              private void stopLocationUpdates() {
                  if (locationManager != null) {
                      try { locationManager.removeUpdates(locationListener); } catch (SecurityException ignored) {}
                  }
                  locationStarted = false;
              }

              private void sendCoordinates(double latitude, double longitude) {
                  String script = String.format(Locale.US,
                      "window.onNativeCoordinates && window.onNativeCoordinates(%.7f,%.7f);",
                      latitude, longitude);
                  runOnUiThread(() -> {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(script, null);
                      }
                  });
              }

              private void sendStatus(String message) {
                  String safe = message.replace("\\", "").replace("'", "");
                  String script = "window.onNativeLocationStatus && window.onNativeLocationStatus('" + safe + "');";
                  runOnUiThread(() -> {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(script, null);
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == AUDIO_PERMISSION_REQUEST) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) startSpeechRecognition();
                      else sendSpeechError("microphone-permission-denied");
                  } else if (requestCode == LOCATION_PERMISSION_REQUEST) {
                      boolean granted = false;
                      for (int result : grantResults) {
                          if (result == PackageManager.PERMISSION_GRANTED) granted = true;
                      }
                      if (granted) startLocationUpdates();
                      else sendStatus("Location permission denied");
                  }
              }

              @Override
              public void onDestroy() {
                  stopLocationUpdates();
                  if (bundledTagalogTts != null) { try { bundledTagalogTts.release(); } catch (Exception ignored) {} bundledTagalogTts = null; }
                  if (textToSpeech != null) {
                      try { textToSpeech.stop(); textToSpeech.shutdown(); } catch (Exception ignored) {}
                      textToSpeech = null;
                      textToSpeechReady = false;
                  }
                  super.onDestroy();
              }
          }
          JAVA

          cat > android/app/src/main/java/com/aljunatis/busfaredesk/BundledTagalogTts.java <<'JAVA'
          package com.aljunatis.busfaredesk;

          import android.app.Activity;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.os.SystemClock;

          import com.k2fsa.sherpa.onnx.GeneratedAudio;
          import com.k2fsa.sherpa.onnx.OfflineTts;
          import com.k2fsa.sherpa.onnx.OfflineTtsConfig;
          import com.k2fsa.sherpa.onnx.OfflineTtsModelConfig;
          import com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class BundledTagalogTts {
              public interface StatusListener { void onStatus(String status); }

              private final Activity activity;
              private final StatusListener listener;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private volatile OfflineTts engine;
              private volatile AudioTrack activeTrack;
              private volatile float playbackPitch = 1.06f;

              public void setVoiceGender(String gender) {
                  playbackPitch = "male".equalsIgnoreCase(gender) ? 0.94f : 1.06f;
              }
              private volatile boolean stopRequested = false;
              private volatile boolean failed = false;
              private volatile boolean closed = false;

              public BundledTagalogTts(Activity activity, StatusListener listener) {
                  this.activity = activity;
                  this.listener = listener;
                  notifyStatus("loading");
                  executor.execute(this::loadModel);
              }

              public boolean isReady() { return engine != null && !closed; }

              public boolean speak(String text) {
                  if (text == null || text.trim().isEmpty() || closed || failed || engine == null) return false;
                  stopRequested = true;
                  pauseCurrentTrack();
                  executor.execute(() -> {
                      stopRequested = false;
                      synthesize(text);
                  });
                  return true;
              }

              public void stop() {
                  stopRequested = true;
                  pauseCurrentTrack();
              }

              public void release() {
                  if (closed) return;
                  closed = true;
                  stop();
                  executor.execute(() -> {
                      OfflineTts current = engine;
                      engine = null;
                      if (current != null) current.release();
                  });
                  executor.shutdown();
              }

              private void loadModel() {
                  try {
                      File directory = new File(activity.getFilesDir(), "tagalog_tts");
                      if (!directory.exists() && !directory.mkdirs()) throw new IllegalStateException("Cannot create voice model directory");
                      File model = new File(directory, "model.onnx");
                      File tokens = new File(directory, "tokens.txt");
                      copyAssetIfMissing("tagalog_tts/model.onnx", model);
                      copyAssetIfMissing("tagalog_tts/tokens.txt", tokens);

                      OfflineTtsVitsModelConfig vits = new OfflineTtsVitsModelConfig();
                      vits.setModel(model.getAbsolutePath());
                      vits.setTokens(tokens.getAbsolutePath());
                      OfflineTtsModelConfig modelConfig = new OfflineTtsModelConfig();
                      modelConfig.setVits(vits);
                      modelConfig.setNumThreads(2);
                      modelConfig.setDebug(false);
                      modelConfig.setProvider("cpu");
                      OfflineTtsConfig config = new OfflineTtsConfig();
                      config.setModel(modelConfig);
                      config.setMaxNumSentences(1);
                      OfflineTts loaded = new OfflineTts(null, config);
                      if (closed) { loaded.release(); return; }
                      engine = loaded;
                      notifyStatus("ready");
                  } catch (Exception error) {
                      failed = true;
                      notifyStatus("bundledUnavailable");
                  }
              }

              private void copyAssetIfMissing(String assetName, File target) throws Exception {
                  if (target.exists() && target.length() > 0) return;
                  File parent = target.getParentFile();
                  if (parent != null && !parent.exists() && !parent.mkdirs()) throw new IllegalStateException("Cannot create model folder");
                  try (InputStream input = activity.getAssets().open(assetName);
                       FileOutputStream output = new FileOutputStream(target)) {
                      byte[] buffer = new byte[1024 * 1024];
                      int count;
                      while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count);
                      output.flush();
                  }
                  if (!target.exists() || target.length() == 0) throw new IllegalStateException("Bundled voice file is empty");
              }

              private void synthesize(String text) {
                  OfflineTts current = engine;
                  if (current == null || closed || stopRequested) return;
                  try {
                      notifyStatus("speaking");
                      GeneratedAudio audio = current.generate(normalizeNumbers(text), 0, 0.96f);
                      if (audio == null || audio.getSamples() == null || audio.getSamples().length == 0) {
                          notifyStatus("error");
                          return;
                      }
                      playAudio(audio);
                      if (!stopRequested && !closed) notifyStatus("done");
                  } catch (Exception error) {
                      notifyStatus("error");
                  }
              }

              private void playAudio(GeneratedAudio audio) throws Exception {
                  float[] samples = audio.getSamples();
                  int sampleRate = audio.getSampleRate();
                  int minBuffer = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  if (minBuffer <= 0) minBuffer = 8192;
                  AudioTrack track = new AudioTrack.Builder()
                      .setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build())
                      .setAudioFormat(new AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(sampleRate)
                          .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                          .build())
                      .setBufferSizeInBytes(Math.max(minBuffer, 8192))
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build();
                  activeTrack = track;
                  track.setVolume(1.0f);
                  track.setPlaybackRate(Math.max(8000, Math.min(48000, Math.round(sampleRate * playbackPitch))));
                  track.play();
                  short[] pcm = new short[2048];
                  int offset = 0;
                  try {
                      while (offset < samples.length && !stopRequested && !closed) {
                          int count = Math.min(pcm.length, samples.length - offset);
                          for (int i = 0; i < count; i++) {
                              float value = Math.max(-1.0f, Math.min(1.0f, samples[offset + i]));
                              pcm[i] = (short) Math.round(value * 32767.0f);
                          }
                          int written = track.write(pcm, 0, count, AudioTrack.WRITE_BLOCKING);
                          if (written < 0) throw new IllegalStateException("AudioTrack write failed: " + written);
                          offset += written;
                      }
                      while (!stopRequested && !closed && track.getPlaybackHeadPosition() < samples.length) {
                          SystemClock.sleep(20);
                      }
                  } finally {
                      try { if (track.getPlayState() == AudioTrack.PLAYSTATE_PLAYING) track.stop(); } catch (Exception ignored) {}
                      try { track.release(); } catch (Exception ignored) {}
                      if (activeTrack == track) activeTrack = null;
                  }
              }

              private void pauseCurrentTrack() {
                  AudioTrack track = activeTrack;
                  if (track != null) {
                      try { track.pause(); track.flush(); } catch (Exception ignored) {}
                  }
              }

              private void notifyStatus(String status) {
                  if (listener != null && !closed) listener.onStatus(status);
              }

              private String normalizeNumbers(String text) {
                  Matcher matcher = Pattern.compile("(?<![\\p{L}])\\d+(?:\\.\\d+)?").matcher(text);
                  StringBuffer output = new StringBuffer();
                  while (matcher.find()) {
                      String spoken = numberWords(matcher.group());
                      matcher.appendReplacement(output, Matcher.quoteReplacement(spoken));
                  }
                  matcher.appendTail(output);
                  return output.toString();
              }

              private String numberWords(String raw) {
                  String[] parts = raw.split("\\.", -1);
                  long whole;
                  try { whole = Long.parseLong(parts[0]); } catch (Exception error) { return raw; }
                  String result = integerWords(whole);
                  if (parts.length > 1 && !parts[1].isEmpty()) {
                      StringBuilder decimal = new StringBuilder(" point");
                      for (int i = 0; i < parts[1].length(); i++) {
                          decimal.append(' ').append(integerWords(parts[1].charAt(i) - '0'));
                      }
                      result += decimal;
                  }
                  return result;
              }

              private String integerWords(long value) {
                  String[] ones = {"zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"};
                  String[] teens = {"ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"};
                  String[] tens = {"", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"};
                  if (value < 0) return "minus " + integerWords(-value);
                  if (value < 10) return ones[(int) value];
                  if (value < 20) return teens[(int) value - 10];
                  if (value < 100) {
                      long unit = value % 10;
                      return tens[(int) (value / 10)] + (unit == 0 ? "" : " " + ones[(int) unit]);
                  }
                  if (value < 1000) {
                      long remainder = value % 100;
                      return integerWords(value / 100) + " hundred" + (remainder == 0 ? "" : " " + integerWords(remainder));
                  }
                  if (value < 1000000) {
                      long remainder = value % 1000;
                      return integerWords(value / 1000) + " thousand" + (remainder == 0 ? "" : " " + integerWords(remainder));
                  }
                  if (value < 1000000000) {
                      long remainder = value % 1000000;
                      return integerWords(value / 1000000) + " million" + (remainder == 0 ? "" : " " + integerWords(remainder));
                  }
                  long remainder = value % 1000000000;
                  return integerWords(value / 1000000000) + " billion" + (remainder == 0 ? "" : " " + integerWords(remainder));
              }
          }
          JAVA

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BUS-FARE-DESK-V60.15-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
