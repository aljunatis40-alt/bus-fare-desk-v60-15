name: Build BUS FARE DESK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android project
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "bus-fare-desk",
            "version": "1.0.0",
            "private": true,
            "description": "BUS FARE DESK Personal Edition"
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aljunatis.busfaredesk",
            "appName": "BUS FARE DESK",
            "webDir": "www"
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BUS-FARE-DESK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
